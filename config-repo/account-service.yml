server:
  port: 8080
spring:
  application:
    name: account-service
  profiles:
    active: prod
  config:
    import:
      - "classpath:application-prod.yml"
      - "classpath:application-qa.yml"
  datasource:
    url: jdbc:h2:mem:accdb

  h2:
    console:
      enabled: true

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

  cloud:
    config:
      enabled: false
    discovery:
      enabled: true
    gateway:
      locator:
        discovery: true

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: "*"

build:
  version: 1

author:
  name: "Aissa Hamza"
  email: "professional.aissa@gmail.com"

