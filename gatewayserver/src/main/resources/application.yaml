server:
  port: 8888

spring:
  application:
    name: gatewayserver

  cloud:
    config:
      enabled: false
    discovery:
      enabled: true
    gateway:
      routes:
        - id: r1
          uri: lb://ACCOUNT-SERVICE
          predicates:
            - Path= /api/accounts/**
        - id: r2
          uri: lb://TRANSACTION-SERVICE
          predicates:
            - Path= /api/transactions/**
      server:
        webflux:
          discovery:
            locator:
              enabled: false
              lower-case-service-id: true
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    gateway:
      access: unrestricted

