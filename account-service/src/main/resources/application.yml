server:
  port: 8080
spring:
  application:
    name: account-service
  profiles:
    active: default
  config:
    import: "optional:configserver:http://localhost:9999/"
  datasource:
    url: jdbc:mysql://mysqldb:3306/test
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

  cloud:
    config:
      enabled: false
    discovery:
      enabled: false
    gateway:
      locator:
        discovery: true

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
build:
  version: 1

author:
  name: "Aissa Hamza"
  email: "professional.aissa@gmail.com"

